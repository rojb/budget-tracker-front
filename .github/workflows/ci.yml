name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install and analyze app
        run: |
          flutter pub get
          flutter analyze

      - name: Install and analyze packages/ui
        working-directory: packages/ui
        run: |
          flutter pub get
          flutter analyze

      - name: Install and analyze widgetbook
        working-directory: widgetbook
        run: |
          flutter pub get
          flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug
