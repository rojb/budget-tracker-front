name: api_client
version: 1.0.0
description: Dio client for the Budget Tracker API, generated from openapi.yaml (see README.md).
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  dio: '^5.7.0'
  one_of: '>=1.5.0 <2.0.0'
  one_of_serializer: '>=1.5.0 <2.0.0'
  built_value: '>=8.4.0 <9.0.0'
  built_collection: '>=5.1.1 <6.0.0'

dev_dependencies:
  built_value_generator: '>=8.4.0 <9.0.0'
  build_runner: any
